<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>HTGL CSS Animation Demo</title>
<style>
/* Phase 2: @keyframes + animation shorthand — transpiles to the same anim records as data-anim.
   This file ALSO plays correctly when opened in a real browser (CSS animations work natively). */

@keyframes slideX {
  from { left: 10px }
  to   { left: 200px }
}

@keyframes slideY {
  from { top: 20px }
  to   { top: 150px }
}
</style>
</head>
<body>
  <div id="screen" style="position:absolute; left:0; top:0; width:240px; height:200px; background-color:#1a1a2e;">

    <!-- Box 1: animates x (pingpong bounce across screen) — CSS equivalent of anim_decl.html box 1 -->
    <div style="position:absolute; left:10px; top:60px; width:30px; height:30px; background-color:#ff5050;
                animation: slideX 1s infinite alternate"></div>

    <!-- Box 2: animates y (pingpong bounce down and up) — CSS equivalent of anim_decl.html box 2 -->
    <div style="position:absolute; left:110px; top:20px; width:30px; height:30px; background-color:#50c8ff;
                animation: slideY 800ms infinite alternate"></div>

  </div>
</body>
</html>
