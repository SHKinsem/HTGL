<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>HTGL Animation Demo</title></head>
<body>
  <div id="screen" style="position:absolute; left:0; top:0; width:240px; height:200px; background-color:#1a1a2e;">

    <!-- Box 1: animates x (pingpong bounce across screen) -->
    <div style="position:absolute; left:10px; top:60px; width:30px; height:30px; background-color:#ff5050"
         data-anim="x" data-from="10" data-to="200" data-dur="1000" data-loop="pingpong"></div>

    <!-- Box 2: animates y (pingpong bounce down and up) -->
    <div style="position:absolute; left:110px; top:20px; width:30px; height:30px; background-color:#50c8ff"
         data-anim="y" data-from="20" data-to="150" data-dur="800" data-loop="pingpong"></div>

  </div>
</body>
</html>
