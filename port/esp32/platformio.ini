; HTGL ESP32 + ST7789 (240x240) PlatformIO project
;
; Edit the -DTFT_* pin defines below to match your wiring.
; Default pins shown are common ESP32 dev-board breakouts — they WILL need
; adjusting for your actual hardware.
;
; After editing ui.html, regenerate the embedded blob:
;   python ../../tool/htgl.py ui.html -o /tmp/ui.uib --emit-c src/ui_blob.c --symbol ui
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5

; ── TFT_eSPI user-setup via build flags (no User_Setup.h editing required) ─────
build_flags =
    ; Tell TFT_eSPI we're supplying our own setup
    -D USER_SETUP_LOADED=1

    ; ST7789 driver, 240x240
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240

    ; RGB colour order (swap to TFT_BGR if your panel shows inverted colours)
    -D TFT_RGB_ORDER=TFT_RGB

    ; ── SPI pins — EDIT THESE FOR YOUR BOARD ─────────────────────────────────
    ; Typical ESP32 dev board wiring for a GC9A01/ST7789 240x240 module:
    ;   MOSI → GPIO 23   (SPI data out)
    ;   SCLK → GPIO 18   (SPI clock)
    ;   CS   → GPIO 15   (chip select,  active LOW)
    ;   DC   → GPIO  2   (data/command select)
    ;   RST  → GPIO  4   (reset, active LOW)
    ;   BL   → GPIO 27   (backlight, active HIGH — see TFT_BL_ON below)
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=27
    ; ── END editable pins ────────────────────────────────────────────────────

    ; SPI clock frequency (40 MHz is safe for most ST7789 panels; try 80 MHz)
    -D SPI_FREQUENCY=40000000

    ; Backlight polarity (HIGH = active-high PWM/GPIO; use LOW if inverted)
    -D TFT_BL_ON=HIGH

    ; Font loads (TFT_eSPI requires at least one font to compile)
    -D LOAD_GLCD=1
